<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="Личный кабинет команды BURЖУЙ">
  <title>BURЖУЙ Команда</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app-root">
    <section id="auth-screen" class="auth-screen" aria-labelledby="auth-title">
      <div class="auth-orbit auth-orbit-one" aria-hidden="true"></div>
      <div class="auth-orbit auth-orbit-two" aria-hidden="true"></div>
      <div class="auth-panel">
        <div class="brand-mark brand-mark-large" aria-hidden="true"><span>Ж</span></div>
        <p class="eyebrow">BURЖУЙ · КОМАНДА</p>
        <h1 id="auth-title">Вход в личный кабинет</h1>
        <p class="auth-subtitle">Работа, задачи и показатели — в одном спокойном пространстве.</p>
        <form id="login-form" class="stack-form" novalidate>
          <label class="field-label" for="login-username">Логин</label>
          <input id="login-username" class="text-input" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="Введите логин">
          <label class="field-label" for="login-password">Пароль</label>
          <div class="input-with-action">
            <input id="login-password" class="text-input" name="password" type="password" autocomplete="current-password" required placeholder="Введите пароль">
            <button id="toggle-login-password" class="input-action" type="button" aria-label="Показать пароль">Показать</button>
          </div>
          <p id="login-error" class="form-error" role="alert"></p>
          <button id="login-submit" class="button button-primary button-large" type="submit"><span>Войти в команду</span><span class="button-spinner" aria-hidden="true"></span></button>
        </form>
        <p class="auth-footnote">Если не получается войти, обратитесь к руководителю.</p>
      </div>
    </section>

    <section id="app-screen" class="app-screen is-hidden" aria-label="Личный кабинет">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <a class="brand-lockup" href="#overview" data-view="overview" aria-label="На главную">
            <span class="brand-mark"><span>Ж</span></span>
            <span><strong>BURЖУЙ</strong><small>Команда</small></span>
          </a>
          <button id="sidebar-collapse" class="icon-button sidebar-collapse" type="button" aria-label="Свернуть меню" title="Свернуть меню"><span>‹</span></button>
        </div>
        <div class="workspace-label">Рабочее пространство</div>
        <nav id="desktop-nav" class="main-nav" aria-label="Основная навигация"></nav>
        <div class="sidebar-bottom">
          <div class="sidebar-tip"><span class="tip-icon">✦</span><div><strong>Фокус дня</strong><span>Меньше шума — больше результата.</span></div></div>
          <button id="sidebar-logout" class="nav-item nav-item-muted" type="button"><span class="nav-icon">↪</span><span class="nav-label">Выйти</span></button>
        </div>
      </aside>

      <div class="page-shell">
        <header class="topbar">
          <div class="topbar-left">
            <button id="mobile-menu" class="icon-button mobile-only" type="button" aria-label="Открыть меню"><span>☰</span></button>
            <div>
              <p id="header-kicker" class="topbar-kicker">ЛИЧНЫЙ КАБИНЕТ</p>
              <h2 id="page-title">Обзор</h2>
            </div>
          </div>
          <div class="topbar-actions">
            <button id="refresh-button" class="icon-button" type="button" aria-label="Обновить данные" title="Обновить данные"><span>↻</span></button>
            <div class="user-menu">
              <div id="header-avatar" class="avatar avatar-small">—</div>
              <div class="user-menu-copy"><strong id="header-name">—</strong><span id="header-role">—</span></div>
              <button id="header-logout" class="text-button desktop-only" type="button">Выйти</button>
            </div>
          </div>
        </header>
        <main id="main-content" class="main-content" tabindex="-1"></main>
      </div>
      <nav id="mobile-nav" class="mobile-nav" aria-label="Мобильная навигация"></nav>
    </section>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
