services:
  - type: web
    name: burzhui-analytics
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile && npx --yes pnpm@11.19.0 build
    startCommand: npm start
    envVars:
      - key: IIKO_HOST
        sync: false
      - key: IIKO_LOGIN
        sync: false
      - key: IIKO_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_ADMIN_USERNAME
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_ADMIN_NAME
        sync: false
      - key: NODE_ENV
        value: production
